<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Autism-friendly místa Hradec Králové</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- PWA a mobilní nastavení -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c2340">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Křesadlo Mapa">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #f8f9fa; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100vw; height: 100dvh; }

    /* Plovoucí hlavní lišta nahoře - pevně ukotvená s rozdělením na 2 řádky */
    #filter-bar {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: calc(100% - 24px);
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(4px);
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    /* Obal pro vyhledávač - stabilní horní řádek */
    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-container {
      display: flex;
      align-items: center;
      background: #edf2f7;
      border-radius: 20px;
      padding: 0 12px;
      height: 34px;
      gap: 8px;
      box-sizing: border-box;
      width: 100%;
    }

    #search-input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 13.5px;
      color: #2d3748;
      width: 100%;
      height: auto;
      line-height: 1;
      padding: 0;
      margin: 0;
    }
    #search-input::placeholder { color: #a0aec0; }

    /* Vyskakovací seznam našeptávače */
    .search-results-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      max-height: 220px;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
      z-index: 2000;
      padding: 6px;
      box-sizing: border-box;
    }

    .search-results-dropdown.active {
      display: block;
    }

    .search-result-item {
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }

    .search-result-item:hover,
    .search-result-item:active {
      background-color: #edf2f7;
    }

    .search-result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .search-result-title {
      font-size: 13px;
      font-weight: 700;
      color: #1a202c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-result-dist {
      font-size: 11px;
      font-weight: 600;
      color: #3a9bb0;
      white-space: nowrap;
    }

    .search-result-sub {
      font-size: 11px;
      color: #718096;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Posuvný pás tlačítek kategorií ve spodním řádku */
    .buttons-scroll-container {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      padding-bottom: 2px;
    }
    .buttons-scroll-container::-webkit-scrollbar { display: none; }

    /* Tlačítka kategorií */
    .filter-btn {
      border: none;
      background-color: #edf2f7;
      color: #4a5568;
      padding: 0 13px;
      height: 29px;
      min-height: 29px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1;
      margin: 0;
      border-radius: 15px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      flex-shrink: 0;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      box-sizing: border-box;
    }

    /* Tlačítko pro zaměření GPS polohy */
    #locate-btn {
      position: absolute;
      bottom: 80px;
      right: 12px;
      z-index: 1000;
      width: 34px;
      height: 34px;
      background: #ffffff;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s ease;
    }
    #locate-btn:hover { background-color: #f4f4f4; }

    /* Bod polohy uživatele */
    .user-location-marker {
      width: 14px;
      height: 14px;
      background-color: #3a9bb0;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(58, 155, 176, 0.35);
    }

    /* Vzhled popup karet */
    .custom-svg-marker { background: transparent; border: none; }
    .popup-box { color: #334155; padding: 2px; line-height: 1.5; }
    .popup-top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .popup-tag { display: inline-block; color: #fff; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 12px; }
    .popup-dist-badge { font-size: 11px; font-weight: 700; color: #3a9bb0; background: #e6f6f9; padding: 2px 7px; border-radius: 10px; }
    .popup-title { margin: 0 0 6px 0; font-size: 15px; font-weight: 700; color: #1e293b; }
    .popup-address { margin: 0 0 8px 0; font-size: 12px; color: #64748b; }
    .popup-desc { margin: 0 0 8px 0; font-size: 13px; color: #475569; }
    .popup-features { background: #f1f5f9; padding: 6px 8px; border-radius: 6px; font-size: 11.5px; line-height: 1.4; border-left: 3px solid #3a9bb0; margin-bottom: 8px; }
    .popup-features strong { color: #0c2340; display: block; margin-bottom: 2px; }
    .popup-actions { display: flex; gap: 6px; }
    .nav-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; padding: 6px; font-size: 11.5px; font-weight: 600; text-decoration: none; border-radius: 6px; }
    .mapycz-btn { background-color: #fbeae8; color: #c02626; border: 1px solid #f5c2bd; }
    .gmaps-btn { background-color: #e8f0fe; color: #1a73e8; border: 1px solid #c2d7fa; }
    .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
  </style>
</head>
<body>

  <div id="filter-bar">
    <div class="search-wrapper">
      <div class="search-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="#718096">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/>
        </svg>
        <input type="text" id="search-input" placeholder="Hledat místo..." autocomplete="off" />
      </div>
      <div id="search-results" class="search-results-dropdown"></div>
    </div>

    <div class="buttons-scroll-container">
      <button class="filter-btn" data-kat="Restaurace">Restaurace</button>
      <button class="filter-btn" data-kat="Kavárny">Kavárny</button>
      <button class="filter-btn" data-kat="Obchody">Obchody</button>
      <button class="filter-btn" data-kat="Volný čas">Volný čas</button>
      <button class="filter-btn" data-kat="Služby">Služby</button>
    </div>
  </div>

  <div id="map"></div>

  <button id="locate-btn" title="Kde se právě nacházím?">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="#2d3748">
      <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
  </button>

  <script>
    // 1. Senzoricky vyladěná paleta
    const categoryConfig = {
      "Restaurace": { 
        color: "#d44b79", 
        path: '<path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/>' 
      },
      "Kavárny": { 
        color: "#d97736", 
        path: '<path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 5h-2V5h2v3zM2 21h18v-2H2v2z"/>' 
      },
      "Obchody": { 
        color: "#3a9bb0", 
        path: '<path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/>' 
      },
      "Volný čas": { 
        color: "#243c5a", 
        path: '<path d="M14 6l-3.8 5h2.8l-4 6h3V22h2v-5h3l-4-6h2.8L14 6z"/>' 
      },
      "Služby": { 
        color: "#64748b", 
        path: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>' 
      }
    };

    function createCustomIcon(kat) {
      const cfg = categoryConfig[kat] || { color: "#64748b", path: '<circle cx="12" cy="12" r="6"/>' };
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 42" width="30" height="40" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">
          <path d="M16 0C7.16 0 0 7.16 0 16c0 10.5 16 26 16 26s16-15.5 16-26C32 7.16 24.84 0 16 0z" fill="${cfg.color}" stroke="#fff" stroke-width="1.5"/>
          <circle cx="16" cy="15" r="9" fill="rgba(255,255,255,0.25)" />
          <g transform="translate(4, 3)" fill="#fff">${cfg.path}</g>
        </svg>`;
      return L.divIcon({ html: svg, className: 'custom-svg-marker', iconSize: [30, 40], iconAnchor: [15, 40], popupAnchor: [0, -36] });
    }

    // 2. Inicializace mapy
    const hradecBounds = L.latLngBounds([50.1400, 15.6800], [50.2900, 15.9800]);
    const map = L.map('map', {
      center: [50.2092, 15.8328],
      zoom: 13,
      minZoom: 12,
      maxZoom: 19,
      zoomControl: false,
      maxBounds: hradecBounds,
      maxBoundsViscosity: 0.8
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Šedobílá mapa Esri bez popisků
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
      maxNativeZoom: 16,
      maxZoom: 19
    }).addTo(map);

    // 3. Maska Hradce
    fetch('Maska_Hradce.geojson')
      .then(res => res.json())
      .then(maskData => {
        L.geoJSON(maskData, {
          style: { 
            fillColor: '#ffffff', 
            fillOpacity: 0.85, 
            color: '#cbd5e1', 
            weight: 1 
          },
          interactive: false
        }).addTo(map);
      })
      .catch(err => console.error("Chyba při načítání masky:", err));

    // 4. Správa dat a vyhledávání
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTA4Zd6p3HcPigz2X2PssGXnHt06uCyV51pAZYz-2yjO-QYEepMNcNua9PvfLl2qyT54iNTqO-KqHnE/pub?gid=0&single=true&output=csv';
    let allMarkers = [];
    let activeCategory = null; // Výchozí čistá mapa
    let currentUserLatLng = null;

    const searchInput = document.getElementById('search-input');
    const resultsDropdown = document.getElementById('search-results');
    const filterButtons = document.querySelectorAll('.filter-btn');

    function formatDistance(meters) {
      if (meters === null || meters === undefined) return '';
      if (meters < 1000) {
        return `${Math.round(meters)} m`;
      }
      return `${(meters / 1000).toFixed(1).replace('.', ',')} km`;
    }

    function createPopupContent(data, distanceMeters) {
      const kat = data.kategorie || '';
      const distBadge = distanceMeters ? `<span class="popup-dist-badge">📍 ${formatDistance(distanceMeters)}</span>` : '';

      return `
        <div class="popup-box">
          <div class="popup-top-row">
            <span class="popup-tag" style="background-color: ${categoryConfig[kat]?.color || '#64748b'};">${kat || 'Místo'}</span>
            ${distBadge}
          </div>
          <h3 class="popup-title">${data.nazev || ''}</h3>
          ${data.adresa ? `<p class="popup-address">📍 ${data.adresa}</p>` : ''}
          ${data.popis ? `<p class="popup-desc">${data.popis}</p>` : ''}
          ${data.autism_friendly_prvky ? `
            <div class="popup-features">
              <strong>Autism-friendly:</strong>
              ${data.autism_friendly_prvky}
            </div>` : ''}
          <div class="popup-actions">
            <a href="https://mapy.cz/zakladni?q=${data.lat},${data.lon}" target="_blank" rel="noopener" class="nav-btn mapycz-btn">🗺️ Mapy.cz</a>
            <a href="https://www.google.com/maps/search/?api=1&query=${data.lat},${data.lon}" target="_blank" rel="noopener" class="nav-btn gmaps-btn">🚗 Google</a>
          </div>
        </div>`;
    }

    function recalculateDistances() {
      if (!currentUserLatLng) return;
      allMarkers.forEach(m => {
        m.currentDistance = currentUserLatLng.distanceTo(m.getLatLng());
        m.setPopupContent(createPopupContent(m.rawData, m.currentDistance));
      });
    }

    function renderDropdownResults(matchingMarkers) {
      if (matchingMarkers.length === 0 || searchInput.value.trim() === '') {
        resultsDropdown.innerHTML = '';
        resultsDropdown.classList.remove('active');
        return;
      }

      if (currentUserLatLng) {
        matchingMarkers.sort((a, b) => (a.currentDistance || 0) - (b.currentDistance || 0));
      }

      resultsDropdown.innerHTML = matchingMarkers.slice(0, 6).map((m, index) => {
        const distBadge = m.currentDistance ? `<span class="search-result-dist">${formatDistance(m.currentDistance)}</span>` : '';
        return `
          <div class="search-result-item" data-index="${index}">
            <div class="search-result-header">
              <span class="search-result-title">${m.placeTitle}</span>
              ${distBadge}
            </div>
            <span class="search-result-sub">${m.category}${m.placeAddress ? ' • ' + m.placeAddress : ''}</span>
          </div>
        `;
      }).join('');

      resultsDropdown.classList.add('active');

      resultsDropdown.querySelectorAll('.search-result-item').forEach((item, idx) => {
        item.addEventListener('click', () => {
          const targetMarker = matchingMarkers[idx];
          if (!map.hasLayer(targetMarker)) {
            map.addLayer(targetMarker);
          }
          map.flyTo(targetMarker.getLatLng(), 17, { duration: 1.2 });
          targetMarker.openPopup();
          resultsDropdown.classList.remove('active');
        });
      });
    }

    function updateVisibleMarkers() {
      const query = searchInput.value.toLowerCase().trim();
      const matching = [];

      allMarkers.forEach(m => {
        const matchesCategory = (activeCategory !== null && m.category === activeCategory);
        const matchesSearch = (query !== '' && m.searchText.includes(query));

        if (matchesCategory || matchesSearch) {
          if (!map.hasLayer(m)) map.addLayer(m);
        } else {
          if (map.hasLayer(m)) map.removeLayer(m);
        }

        if (query !== '' && m.searchText.includes(query)) {
          matching.push(m);
        }
      });

      renderDropdownResults(matching);
    }

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      complete: function(results) {
        results.data.forEach(row => {
          const lat = parseFloat(String(row.lat || '').replace(',', '.').trim());
          const lon = parseFloat(String(row.lon || '').replace(',', '.').trim());
          const kat = (row.kategorie || '').trim();

          if (!isNaN(lat) && !isNaN(lon) && row.nazev) {
            const rawData = { ...row, lat, lon, kategorie: kat };
            const marker = L.marker([lat, lon], { icon: createCustomIcon(kat) })
              .bindPopup(createPopupContent(rawData, null), { maxWidth: 280, minWidth: 220 });

            marker.rawData = rawData;
            marker.category = kat;
            marker.placeTitle = row.nazev || '';
            marker.placeAddress = row.adresa || '';
            marker.currentDistance = null;
            marker.searchText = `${row.nazev || ''} ${row.adresa || ''} ${row.popis || ''} ${row.autism_friendly_prvky || ''}`.toLowerCase();
            
            allMarkers.push(marker);
          }
        });

        if (currentUserLatLng) {
          recalculateDistances();
        }
      }
    });

    // 5. Tlačítka filtru (opětovné kliknutí zruší filtr zpět na čistou mapu)
    filterButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const clickedCat = e.currentTarget.getAttribute('data-kat');

        if (activeCategory === clickedCat) {
          activeCategory = null;
          e.currentTarget.classList.remove('active');
          e.currentTarget.style.removeProperty('background-color');
          e.currentTarget.style.removeProperty('color');
        } else {
          activeCategory = clickedCat;
          filterButtons.forEach(b => {
            b.classList.remove('active');
            b.style.removeProperty('background-color');
            b.style.removeProperty('color');
          });

          e.currentTarget.classList.add('active');

          if (categoryConfig[activeCategory]) {
            e.currentTarget.style.setProperty('background-color', categoryConfig[activeCategory].color, 'important');
            e.currentTarget.style.setProperty('color', '#ffffff', 'important');
          }
        }

        updateVisibleMarkers();
      });
    });

    // 6. Vyhledávání
    searchInput.addEventListener('input', updateVisibleMarkers);

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = searchInput.value.toLowerCase().trim();
        if (!query) return;

        const firstMatch = allMarkers.find(m => m.searchText.includes(query));
        if (firstMatch) {
          if (!map.hasLayer(firstMatch)) map.addLayer(firstMatch);
          map.flyTo(firstMatch.getLatLng(), 17, { duration: 1.2 });
          firstMatch.openPopup();
          resultsDropdown.classList.remove('active');
        }
      }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrapper')) {
        resultsDropdown.classList.remove('active');
      }
    });

    // 7. Geolokace
    let userLocationMarker = null;
    let userAccuracyCircle = null;
    const locateBtn = document.getElementById('locate-btn');

    locateBtn.addEventListener('click', () => {
      map.locate({ setView: false, enableHighAccuracy: true });
    });

    map.on('locationfound', (e) => {
      currentUserLatLng = e.latlng;
      recalculateDistances();
      if (searchInput.value.trim() !== '') updateVisibleMarkers();

      if (userLocationMarker) map.removeLayer(userLocationMarker);
      if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);

      userAccuracyCircle = L.circle(e.latlng, {
        radius: e.accuracy,
        color: '#3a9bb0',
        fillColor: '#3a9bb0',
        fillOpacity: 0.12,
        weight: 1
      }).addTo(map);

      const userIcon = L.divIcon({
        className: 'user-location-marker',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });

      userLocationMarker = L.marker(e.latlng, { icon: userIcon })
        .addTo(map)
        .bindPopup('<strong>Tvoje poloha</strong><br>Přesnost: cca ' + Math.round(e.accuracy) + ' m');

      map.flyTo(e.latlng, 16, {
        animate: true,
        duration: 1.5,
        easeLinearity: 0.25
      });

      setTimeout(() => {
        if (userLocationMarker) userLocationMarker.openPopup();
      }, 1500);
    });

    map.on('locationerror', () => {
      alert('Nepodařilo se zjistit polohu. Zkontroluj, zda má prohlížeč povolený přístup k poloze.');
    });

    map.locate({ setView: false, enableHighAccuracy: true });

    // 8. Registrace Service Workeru
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('PWA OK:', reg.scope))
          .catch(err => console.error('PWA Err:', err));
      });
    }
  </script>
</body>
</html>
