<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Autism-friendly místa Hradec Králové</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #f8f9fa; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100vw; height: 100dvh; }

    /* Plovoucí filtr nahoře */
    #filter-bar {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%); /* Vycentruje lištu přesně na střed */
  z-index: 1000;
  display: flex;
  gap: 6px;
  width: auto;                  /* Přizpůsobí šířku jen tlačítkům */
  max-width: calc(100% - 28px); /* Na malém mobilu nepustí lištu mimo obrazovku */
  overflow-x: auto;
  padding: 6px 10px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(4px);   /* Moderní jemné rozostření pod lištou */
  border-radius: 30px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  -webkit-overflow-scrolling: touch;
}

#filter-bar::-webkit-scrollbar {
  display: none;                /* Skryje posuvník */
}
    #filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      border: none;
      background: #edf2f7;
      color: #4a5568;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .filter-btn {
  border: none;
  background: #edf2f7;
  color: #4a5568;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
}
/* Tlačítko pro zaměření polohy */
#locate-btn {
  position: absolute;
  bottom: 80px; /* Umístí se nad zoom tlačítka */
  right: 12px;
  z-index: 1000;
  width: 34px;
  height: 34px;
  background: #ffffff;
  border: 2px solid rgba(0, 0, 0, 0.2);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  transition: background-color 0.2s ease;
}
#locate-btn:hover {
  background-color: #f4f4f4;
}

/* Pulzující modrý bod polohy */
.user-location-marker {
  width: 14px;
  height: 14px;
  background-color: #00a0be; /* Tyrkysová Křesadla */
  border: 2.5px solid #ffffff;
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(0, 160, 190, 0.35);
}

    /* Styl pinu a popupu */
    .custom-svg-marker { background: transparent; border: none; }
    .popup-box { color: #2d3748; padding: 2px; }
    .popup-tag { display: inline-block; color: #fff; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 12px; margin-bottom: 6px; }
    .popup-title { margin: 0 0 6px 0; font-size: 15px; font-weight: 700; color: #1a202c; }
    .popup-address { margin: 0 0 8px 0; font-size: 12px; color: #718096; }
    .popup-desc { margin: 0 0 8px 0; font-size: 13px; line-height: 1.4; color: #4a5568; }
    .popup-features { background: #edf2f7; padding: 6px 8px; border-radius: 6px; font-size: 11.5px; line-height: 1.35; border-left: 3px solid #3182ce; margin-bottom: 8px; }
    .popup-features strong { color: #2b6cb0; display: block; margin-bottom: 2px; }
    .popup-actions { display: flex; gap: 6px; }
    .nav-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; padding: 6px; font-size: 11.5px; font-weight: 600; text-decoration: none; border-radius: 6px; }
    .mapycz-btn { background-color: #fbeae8; color: #c02626; border: 1px solid #f5c2bd; }
    .gmaps-btn { background-color: #e8f0fe; color: #1a73e8; border: 1px solid #c2d7fa; }
    .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
  </style>
</head>
<body>

  <div id="filter-bar">
    <button class="filter-btn active" data-kat="all">Vše</button>
    <button class="filter-btn" data-kat="Restaurace">Restaurace</button>
    <button class="filter-btn" data-kat="Kavárny">Kavárny</button>
    <button class="filter-btn" data-kat="Obchody">Obchody</button>
    <button class="filter-btn" data-kat="Volný čas">Volný čas</button>
    <button class="filter-btn" data-kat="Služby">Služby</button>
    <div id="filter-bar">
  <div class="search-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="#718096">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
    <input type="text" id="search-input" placeholder="Hledat místo..." autocomplete="off" />
</div>
  </div>

  <div id="map"></div>
  <button id="locate-btn" title="Kde se právě nacházím?">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="#2d3748">
    <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
  </svg>
</button>

  <script>
    // 1. Konfigurace kategorií
    const categoryConfig = {
  "Restaurace": { 
    color: "#e6007e", // Magenta z loga
    path: '<path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/>' 
  },
  "Kavárny": { 
    color: "#e85d04", // Teplá oranžovo-korálová
    path: '<path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 5h-2V5h2v3zM2 21h18v-2H2v2z"/>' 
  },
  "Obchody": { 
    color: "#00a0be", // Tyrkysová z loga
    path: '<path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/>' 
  },
  "Volný čas": { 
    color: "#0c2340", // Tmavě modrá z loga
    path: '<path d="M14 6l-3.8 5h2.8l-4 6h3V22h2v-5h3l-4-6h2.8L14 6z"/>' 
  },
  "Služby": { 
    color: "#5c6b73", // Břidlicově šedá (odvozená ze šedého kvadrantu)
    path: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>' 
  }
};

    function createCustomIcon(kat) {
      const cfg = categoryConfig[kat] || { color: "#4a5568", path: '<circle cx="12" cy="12" r="6"/>' };
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 42" width="30" height="40" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">
          <path d="M16 0C7.16 0 0 7.16 0 16c0 10.5 16 26 16 26s16-15.5 16-26C32 7.16 24.84 0 16 0z" fill="${cfg.color}" stroke="#fff" stroke-width="1.5"/>
          <circle cx="16" cy="15" r="9" fill="rgba(255,255,255,0.25)" />
          <g transform="translate(4, 3)" fill="#fff">${cfg.path}</g>
        </svg>`;
      return L.divIcon({ html: svg, className: 'custom-svg-marker', iconSize: [30, 40], iconAnchor: [15, 40], popupAnchor: [0, -36] });
    }

    // 2. Inicializace mapy
    const hradecBounds = L.latLngBounds([50.1400, 15.6800], [50.2900, 15.9800]);
    // 1. Vytvoření mapy bez výchozího zoom controlu
const map = L.map('map', {
  center: [50.2092, 15.8328],
  zoom: 13,
  minZoom: 12,
  maxZoom: 18,
  zoomControl: false, // <- Vypne zoom vlevo nahoře
  maxBounds: hradecBounds,
  maxBoundsViscosity: 0.8
});

// 2. Přidání zoomu do pravého dolního rohu
L.control.zoom({ position: 'bottomright' }).addTo(map);

   
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

    // 4. Načtení masky Hradce
    fetch('Maska_Hradce.geojson')
      .then(res => res.json())
      .then(maskData => {
        L.geoJSON(maskData, {
          style: { fillColor: '#f8f9fa', fillOpacity: 0.9, color: '#718096', weight: 1.5 },
          interactive: false
        }).addTo(map);
      })
      .catch(err => console.error("Chyba při načítání masky:", err));

    // 5. Načtení bodů z Google Sheetu
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTA4Zd6p3HcPigz2X2PssGXnHt06uCyV51pAZYz-2yjO-QYEepMNcNua9PvfLl2qyT54iNTqO-KqHnE/pub?gid=0&single=true&output=csv';
    let allMarkers = [];

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      complete: function(results) {
        results.data.forEach(row => {
          const lat = parseFloat(String(row.lat || '').replace(',', '.').trim());
          const lon = parseFloat(String(row.lon || '').replace(',', '.').trim());
          const kat = (row.kategorie || '').trim();

          if (!isNaN(lat) && !isNaN(lon) && row.nazev) {
            const popupHtml = `
              <div class="popup-box">
                <span class="popup-tag" style="background-color: ${categoryConfig[kat]?.color || '#4a5568'};">${kat || 'Místo'}</span>
                <h3 class="popup-title">${row.nazev}</h3>
                ${row.adresa ? `<p class="popup-address">📍 ${row.adresa}</p>` : ''}
                ${row.popis ? `<p class="popup-desc">${row.popis}</p>` : ''}
                ${row.autism_friendly_prvky ? `
                  <div class="popup-features">
                    <strong>Autism-friendly:</strong>
                    ${row.autism_friendly_prvky}
                  </div>` : ''}
                <div class="popup-actions">
                  <a href="https://mapy.cz/zakladni?q=${lat},${lon}" target="_blank" rel="noopener" class="nav-btn mapycz-btn">🗺️ Mapy.cz</a>
                  <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}" target="_blank" rel="noopener" class="nav-btn gmaps-btn">🚗 Google</a>
                </div>
              </div>`;

            const marker = L.marker([lat, lon], { icon: createCustomIcon(kat) }).bindPopup(popupHtml, { maxWidth: 280, minWidth: 220 });
            marker.category = kat;
            marker.addTo(map);
            allMarkers.push(marker);
          }
        });
      }
    });

    // 6. Logika filtru kategorií
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const cat = e.target.getAttribute('data-kat');

        allMarkers.forEach(m => {
          if (cat === 'all' || m.category === cat) {
            if (!map.hasLayer(m)) map.addLayer(m);
          } else {
            if (map.hasLayer(m)) map.removeLayer(m);
          }
        });
      });
    });
    const filterButtons = document.querySelectorAll('.filter-btn');

filterButtons.forEach(btn => {
  btn.addEventListener('click', (e) => {
    const selectedCat = e.currentTarget.getAttribute('data-kat');

    // 1. Reset všech tlačítek na výchozí šedou
    filterButtons.forEach(b => {
      b.classList.remove('active');
      b.style.removeProperty('background-color');
      b.style.removeProperty('color');
    });

    // 2. Aktivace a obarvení kliknutého tlačítka
    e.currentTarget.classList.add('active');

    if (selectedCat === 'all') {
      e.currentTarget.style.setProperty('background-color', '#0c2340', 'important'); // Tmavě modrá pro Vše
      e.currentTarget.style.setProperty('color', '#ffffff', 'important');
    } else if (categoryConfig[selectedCat]) {
      // Vytáhne přesnou barvu z konfigurace (pro Restaurace růžovou #e6007e)
      e.currentTarget.style.setProperty('background-color', categoryConfig[selectedCat].color, 'important');
      e.currentTarget.style.setProperty('color', '#ffffff', 'important');
    }

    // 3. Filtrace markerů na mapě
    allMarkers.forEach(m => {
      if (selectedCat === 'all' || m.category === selectedCat) {
        if (!map.hasLayer(m)) map.addLayer(m);
      } else {
        if (map.hasLayer(m)) map.removeLayer(m);
      }
    });
  });
});

// Výchozí obarvení tlačítka "Vše" při startu
const defaultBtn = document.querySelector('.filter-btn[data-kat="all"]');
if (defaultBtn) {
  defaultBtn.style.setProperty('background-color', '#0c2340', 'important');
  defaultBtn.style.setProperty('color', '#ffffff', 'important');
}
let userLocationMarker = null;
let userAccuracyCircle = null;

const locateBtn = document.getElementById('locate-btn');

locateBtn.addEventListener('click', () => {
  // Spustí vyhledání polohy s vysokou přesností
  map.locate({
    setView: true,
    maxZoom: 16,
    enableHighAccuracy: true
  });
});

// Když mapa úspěšně získá polohu
map.on('locationfound', (e) => {
  // Pokud už marker existuje, smažeme ho před překreslením
  if (userLocationMarker) map.removeLayer(userLocationMarker);
  if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);

  // 1. Kruh přesnosti GPS
  userAccuracyCircle = L.circle(e.latlng, {
    radius: e.accuracy,
    color: '#00a0be',
    fillColor: '#00a0be',
    fillOpacity: 0.12,
    weight: 1
  }).addTo(map);

  // 2. Samotný středový bod
  const userIcon = L.divIcon({
    className: 'user-location-marker',
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });

  userLocationMarker = L.marker(e.latlng, { icon: userIcon })
    .addTo(map)
    .bindPopup('<strong>Tvoje poloha</strong><br>Přesnost: cca ' + Math.round(e.accuracy) + ' m')
    .openPopup();
});

// Ošetření chyby (např. nepovolená geolokace)
map.on('locationerror', (e) => {
  alert('Nepodařilo se zjistit polohu. Zkontroluj, zda má prohlížeč povolený přístup k poloze.');
});
  </script>
</body>
</html>
